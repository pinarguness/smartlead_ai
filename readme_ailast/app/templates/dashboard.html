<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>msun Yönetim Paneli</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;padding:20px;background:#eef3fb;color:#333}
h1{color:#1e2a5a}table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden}
th,td{padding:10px;text-align:left;border-bottom:1px solid #eee}th{background:#1e2a5a;color:#fff}
.k{overflow-x:auto}
</style></head><body>
<h1>msun Lead Paneli</h1>
<div class="k"><table><thead><tr><th>İsim</th><th>Telefon</th><th>Mesaj</th><th>Tarih</th></tr></thead>
<tbody id="govde"><tr><td colspan="4">Yükleniyor...</td></tr></tbody></table></div>
<script>
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
fetch('/api/leads').then(r=>r.json()).then(d=>{
  const g = document.getElementById('govde');
  if(!d.basari||!d.leadler.length){g.innerHTML='<tr><td colspan="4">Kayıt yok</td></tr>';return;}
  g.innerHTML = d.leadler.map(l=>`<tr><td>${esc(l.isim)}</td><td>${esc(l.telefon)}</td><td>${esc(l.mesaj)}</td><td>${esc(l.tarih)}</td></tr>`).join('');
});
</script></body></html>
